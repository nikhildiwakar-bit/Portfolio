<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' https: wss:; media-src 'self' blob: mediastream:; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Office TV Screen Receiver</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #e8eef0; overflow: hidden;
  font: 500 clamp(18px, 2.2vw, 34px)/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* The picture fills the screen at full quality: the whole frame, aspect ratio kept (black bars if the laptop
   screen is not 16:9), drawn 1:1 by the compositor; no transforms, filters or pixelated scaling. */
video { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 50%;
  image-rendering: auto; transform: none; filter: none; background: #000; }
#status { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .6em; text-align: center; padding: 0 8vw; background: #000; }
#status[hidden] { display: none; }
#status small { color: #9fb0b5; font-size: .7em; font-weight: 400; }
.pill { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); background: rgba(0,0,0,.72);
  padding: .4em 1em; border-radius: .6em; font-size: .7em; white-space: nowrap; }
.pill[hidden] { display: none; }
#note { top: 5vh; bottom: auto; }
/* Guest sharing: the question for the person at the TV (OK on the remote, or a tap on the panel). */
#guest { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.86); }
#guest[hidden] { display: none; }
#guest .box { max-width: 70vw; padding: 1.6em 2.2em; border-radius: .8em; background: #10262b; border: 2px solid #2fd6c7;
  text-align: center; }
#guest .box > * + * { margin-top: .6em; }
#guestTitle { font-size: 1.25em; font-weight: 700; }
#guest .sub { color: #b9c9cc; font-size: .8em; font-weight: 400; }
#guestPin { font-size: 3em; font-weight: 800; letter-spacing: .25em; color: #2fd6c7; line-height: 1.1; }
#guest .btns { display: flex; justify-content: center; margin-top: .4em; }
#guest .btns button + button { margin-left: 1em; } /* no flex gap in the TV's WebView 83 */
#guest button { font: inherit; padding: .5em 1.6em; border-radius: .5em; border: 2px solid #3b5b61; background: #18363c; color: #e8eef0; cursor: pointer; }
#guest button:focus { outline: 4px solid #ffd54a; outline-offset: 3px; }
#guest #guestAllow { background: #1f8f84; border-color: #2fd6c7; }
html.otv-native, html.otv-native body, html.otv-native #video { background: transparent !important; }
html.otv-native #video { visibility: hidden; }
</style>
</head>
<body>
<video id="video" autoplay playsinline disablepictureinpicture disableremoteplayback></video>
<div id="status" role="status"><span id="statusText">Getting ready…</span><small id="statusSub"></small></div>
<div id="note" class="pill" role="status" hidden></div>
<div id="guest" role="alertdialog" aria-modal="true" aria-labelledby="guestTitle" aria-describedby="guestText" hidden>
  <div class="box">
    <div id="guestTitle">A guest laptop wants to share its screen</div>
    <div class="sub" id="guestText">It is on another network. Allow it only if the guest's laptop shows this number:</div>
    <div id="guestPin">000</div>
    <div class="btns"><button id="guestAllow" type="button">Allow</button><button id="guestDeny" type="button">Don't allow</button></div>
    <div class="sub">Press OK on the remote to allow, or Back to refuse.</div>
  </div>
</div>
<div id="sound" class="pill" hidden>Sound is off. Press OK on the remote to turn it on.</div>
<script type="module" src="receive.js?v=12"></script>
</body>
</html>
