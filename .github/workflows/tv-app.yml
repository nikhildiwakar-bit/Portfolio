name: Build Office TV app

on:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: tv-app
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk OfficeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeTV-apk
          path: OfficeTV.apk

      # Fixed public link: .../releases/download/tv-app-latest/OfficeTV.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete tv-app-latest --yes --cleanup-tag || true
          gh release create tv-app-latest OfficeTV.apk \
            --target "${{ github.sha }}" \
            --title "Office TV app (latest)" \
            --notes "TV par install karne ke liye OfficeTV.apk download karein. Steps: tv-app/README.md"
