plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nikhil.officetv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nikhil.officetv'
        minSdk 21
        targetSdk 33
        versionCode 21
        versionName '4.0'
    }

    // One shared key so every new build installs as an update over the old one.
    signingConfigs {
        shared {
            storeFile file('officetv.keystore')
            storePassword 'officetv'
            keyAlias 'officetv'
            keyPassword 'officetv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    // src/debug holds DebugHooks with the loopback test API used by tv-app/ci; src/release has no-op
    // stubs, so release APKs contain no server and never log the pairing code.

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
        }
        // Same app without the Accessibility service, for TVs where Play Protect or "Restricted setting"
        // blocks it. It opens the cast screen with "Display over other apps" instead.
        lite {
            dimension 'edition'
        }
    }

    // The website's receiver page and scripts, bundled (copyReceiverAssets below): CastActivity serves them for
    // the website's own https URLs, so the cast screen opens at once and without the internet.
    sourceSets {
        main {
            assets.srcDirs += [layout.buildDirectory.dir('generated/receiverAssets').get().asFile]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkOnly 'NewApi'
        abortOnError true
        checkReleaseBuilds false
    }
}

// One small library: ZXing core draws the phone QR code on the TV home screen. Everything else (relay client,
// WebRTC receiver in a WebView, phone mirroring with MediaCodec) uses only the Android framework.
dependencies {
    implementation 'com.google.zxing:core:3.3.0'
}

// Copies ../../tv/*.js and receive.html (the website, next to tv-app/) to assets/receiver/ in every build (Sync:
// files deleted from the website disappear from the app too).
def siteDir = file("$rootDir/../tv")
if (!new File(siteDir, 'receive.html').isFile()) {
    throw new GradleException("Website files not found in $siteDir: the app bundles the receiver page from there.")
}
def copyReceiverAssets = tasks.register('copyReceiverAssets', Sync) {
    from(siteDir) {
        include '*.js', 'receive.html'
    }
    into layout.buildDirectory.dir('generated/receiverAssets/receiver')
}
preBuild.dependsOn copyReceiverAssets
// Tasks that read the asset folders (merging, lint) run after the copy, so Gradle sees the order it needs.
tasks.configureEach { t ->
    if (t.name != 'copyReceiverAssets' && (t.name ==~ /merge\w*Assets/ || t.name.toLowerCase().contains('lint'))) {
        t.dependsOn copyReceiverAssets
    }
}
