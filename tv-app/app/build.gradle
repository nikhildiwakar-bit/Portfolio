plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nikhil.officetv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nikhil.officetv'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    // One shared key so every new build installs as an update over the old one.
    signingConfigs {
        shared {
            storeFile file('officetv.keystore')
            storePassword 'officetv'
            keyAlias 'officetv'
            keyPassword 'officetv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // 3.3.0 is the last zxing core that runs on Android 5+ without desugaring.
    implementation 'com.google.zxing:core:3.3.0'
}
